        <style>
        :root{
            --color-primario: #8ace00;
            --color-secundario: #0E1400;
            --color-terceario: #E7FFAD;
            --color-cuarto: #F8FFEB;
            --color-quinto: #527A00;
        }
        *{
            box-sizing: border-box;
        }
        body{
            background-color: var(--color-primario);
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            margin: 0;
        }
        header{
            padding: 15px;
            display: flex;
            justify-content: flex-end;
            background-color: var(--color-secundario);
        }
        .search{
            background-color: var(--color-primario);
            border: 2px solid var(--color-terceario);
            border-radius: 50px;
            font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
            font-size: 15px;
            padding: 8px 15px;
            color: var(--color-terceario);
        }
        .search::placeholder{
            color: var(--color-quinto);
        }
        .search:focus{
            outline: none;
            background-color: var(--color-quinto);
        }
        main{
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
        }
        .personaje{
            width: 400px;
            margin: 15px;
            background-color: var(--color-secundario);
            box-shadow: 0 5px 5px black;
            position: relative;
            overflow: hidden;
            border-radius: 5px;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
        }
        .personaje img{
            width: 80%;
            height: 400px;
            object-fit: contain;
        }
        .personaje-info{
            color: var(--color-terceario);
            display: flex;
            align-content: center;
            justify-content: space-between;
            gap: 15px;
            padding: 15px 15px 15px;
            letter-spacing: 5px;
            text-align: center; 
        }
        .personaje-info h3{
            color: var(--color-terceario);
            margin-top: 0;
        }
        .overview{
            background-color: var(--color-quinto);
            color: var(--color-cuarto);
            padding: 1rem;
            position: absolute;
            left: 0;
            bottom: 0;
            right: 0;
            max-height: 100%; 
            transform: translateY(101%);
            overflow-y: auto;
            transition: transform 0.3s ease-in;
            text-align: center;
        }
        .overview h3 {
            color: var(--color-terceario);
            margin-top: 0;
        }
        .personaje:hover .overview{
            transform: translateY(0);
        }
        </style>
        
        <header>    
            <form id="form">
                <img src="logo.jpg" alt="logo" style="width:100px;"/>
                <input type="text" id="search" class="search" placeholder="Buscar personaje">
            </form>
        </header> 

        <main id="main"></main>
        
        <script>
        const API_URL = 'https://dragonball-api.com/api/characters';
        const main = document.getElementById('main');
        const form = document.getElementById('form');
        const search = document.getElementById("search");

        getDBZ(API_URL);

        async function getDBZ(url){
            try {
                const res = await fetch(url);
                const data = await res.json();
                showDBZ(data.items || data);
            } catch (error) {
                console.error("Error al obtener personajes:", error);
                main.innerHTML = '<p>Error al cargar los personajes. Intenta de nuevo más tarde.</p>';
            }
        }

        function showDBZ(personajes){
            main.innerHTML = '';
            if (!personajes || personajes.length === 0) {
                main.innerHTML = '<p>No se encontraron personajes.</p>';
                return;
            }

            personajes.forEach(personaje => {
                const {name, image, ki, maxKi, description, race} = personaje;
                
                const personajeElements = document.createElement('div');
                personajeElements.classList.add('personaje');
                personajeElements.innerHTML = `
                    <img src="${image}" alt="${name}">
                    <div class="personaje-info">
                        <h3>${name}</h3>
                        <span>Ki: ${ki}</span>
                        <span>Max Ki: ${maxKi}</span>
                    </div>
                    <div class="overview">
                        <h3>Race: ${race}</h3>
                        <p>${description || "Sin descripción disponible"}</p>
                    </div>`;
                main.appendChild(personajeElements);
            });
        }

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const searchTerm = search.value.trim();
            if (searchTerm && searchTerm !== ''){
                getDBZ(API_URL + '?name=' + searchTerm);
                search.value = '';
            } else {
                getDBZ(API_URL);
            }
        });
        </script>
    </body>
