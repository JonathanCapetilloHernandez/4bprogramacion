<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peliculas API</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            background-color: #5d842b;
            font-family: 'Gill Sans', 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            margin: 0;
        }
        header {
            padding: 1rem;
            display: flex;
            justify-content: flex-end;
            background-color: #99cc3f;
        }
        .search {
            background-color: #8ace00;
            border: 2px solid #8ace00; /* Cambiado para usar un color válido */
            border-radius: 50px;
            font-family: inherit;
            font-size: 15px;
            padding: 0.5rem 1rem;
            color: rgb(0, 0, 0);
        }
        .search::placeholder { /* Corregido el selector */
            color: #7378c5;
            background-color: #373b69;
        }
        main {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
        }
        .movie {
            width: 300px;
            margin: 1rem;
            background-color: #8ace00;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2); /* Añadido un efecto de sombra */
            position: relative;
            overflow: hidden;
            border-radius: 3px;
        }
        .movie img {
            width: 100%;
        }
        .movie-info {
            color: #8ace00;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.2rem;
            padding: 0.5rem 1rem 1rem;
            letter-spacing: 0.5px;
        }
        .movie-info h3 {
            margin-top: 0;
        }
        .movie-info span {
            background-color: #5d842b;
            padding: 0.25rem 0.5rem;
            border-radius: 3px;
            font-weight: bold;
        }
        .movie-info span.blue {
            color: #7378c5;
        }
        .movie-info span.white {
            color: #d4eaa9;
        }
        .movie-info span.red {
            color: #9df703;
        }
        .overview {
            background-color: aliceblue;
            padding: 2rem;
            position: absolute;
            left: 0;
            bottom: 0;
            right: 0;
            max-width: 100%;
            transform: translateY(101%);
            overflow-y: auto;
            transition: transform 0.3s ease-in; /* Corregido el tiempo de transición */
        }
        .movie:hover .overview {
            transform: translateY(0);
        }
    </style>
</head>
<body>

                            <a class="dropdown-item" href="../jon01.PHP">Practica 1</a><br>

                <ul class="nav navbar-nav">

    <header>
        <input type="text" id="search" class="search" placeholder="Buscar película">
    </header>
    <main id="main"></main>

    <script>
        const API_URL = 'https://api.themoviedb.org/3/discover/movie?sort_by=popularity.desc&api_key=3fd2be6f0c70a2a598f084ddfb75487c&page=1';
        const IMG_PATH = 'https://image.tmdb.org/t/p/w1280';
        const SEARCH_API = 'https://api.themoviedb.org/3/search/movie?api_key=3fd2be6f0c70a2a598f084ddfb75487c&query=';

        const main = document.getElementById('main');
        const search = document.getElementById('search');

        getMovies(API_URL);

        async function getMovies(url) {
            const res = await fetch(url);
            const data = await res.json(); // Corregido el uso de fetch
            showMovies(data.results);
        }

        function showMovies(movies) {
            main.innerHTML = '';
            movies.forEach((movie) => {
                const { title, poster_path, vote_average, overview } = movie;
                const movieElements = document.createElement('div');
                movieElements.classList.add('movie'); // Añadido para aplicar estilos
                movieElements.innerHTML = `
                    <img src="${IMG_PATH + poster_path}" alt="${title}">
                    <div class="movie-info">
                        <h3>${title}</h3>
                        <span class="${getClassByRate(vote_average)}">${vote_average}</span>
                    </div>
                    <div class="overview">
                        <h3>Overview</h3>
                        ${overview}
                    </div>`;
                main.appendChild(movieElements);
            });
        }

        function getClassByRate(vote) {
            if (vote >= 8) {
                return 'blue';
            } else if (vote >= 5) { // Corregido el valor de comparación
                return 'white';
            } else {
                return 'red';
            }
        }

        search.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                const searchTerm = search.value;
                if (searchTerm && searchTerm !== '') {
                    getMovies(SEARCH_API + searchTerm);
                    search.value = '';
                } else {
                    window.location.reload();
                }
            }
        });
    </script>
